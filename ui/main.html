<!DOCTYPE html>
<div class="db-memory-extension">
    <div class="extension-tabs">
        <button class="tab-btn active" data-tab="connection">Connection</button>
        <button class="tab-btn" data-tab="memory">Memory</button>
        <button class="tab-btn" data-tab="context">Context</button>
        <button class="tab-btn" data-tab="settings">Settings</button>
    </div>

    <div class="tab-content">
        <!-- Connection Tab -->
        <div id="tab-connection" class="tab-pane active">
            <h2>Backend Connection</h2>
            
            <div class="form-group">
                <label for="backend-url">Backend URL</label>
                <input type="url" id="backend-url" placeholder="https://api.example.com" />
            </div>

            <div class="form-group">
                <label for="username">Username</label>
                <input type="text" id="username" placeholder="Enter username" />
            </div>

            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" placeholder="Enter password" />
            </div>

            <div class="button-group">
                <button id="btn-connect" class="primary">Connect</button>
                <button id="btn-disconnect" class="secondary">Disconnect</button>
                <button id="btn-test" class="tertiary">Test Connection</button>
            </div>

            <div id="connection-status" class="status-indicator disconnected">
                <span class="status-dot"></span> Disconnected
            </div>
        </div>

        <!-- Memory Tab -->
        <div id="tab-memory" class="tab-pane">
            <div class="memory-toolbar">
                <div class="search-box">
                    <input type="text" id="memory-search" placeholder="Search memories..." />
                    <button id="btn-search"></button>
                </div>
                
                <div class="filter-group">
                    <select id="filter-type">
                        <option value="">All Types</option>
                        <option value="fact">Fact</option>
                        <option value="event">Event</option>
                        <option value="preference">Preference</option>
                        <option value="relationship">Relationship</option>
                    </select>
                    
                    <select id="filter-importance">
                        <option value="">All Importance</option>
                        <option value="critical">Critical</option>
                        <option value="important">Important</option>
                        <option value="normal">Normal</option>
                    </select>
                    
                    <select id="sort-by">
                        <option value="relevance">Sort by Relevance</option>
                        <option value="date">Sort by Date</option>
                        <option value="importance">Sort by Importance</option>
                    </select>
                </div>
                
                <button id="btn-refresh" class="icon-btn">↻ Refresh</button>
                <button id="btn-new-memory" class="primary">+ New Memory</button>
            </div>

            <div id="memory-list" class="memory-list">
                <div class="empty-state">Connect to backend to load memories</div>
            </div>

            <div id="memory-pagination" class="pagination">
                <button id="btn-prev-page" disabled>← Previous</button>
                <span class="page-info">Page 1</span>
                <button id="btn-next-page" disabled>Next →</button>
            </div>
        </div>

        <!-- Context Tab -->
        <div id="tab-context" class="tab-pane">
            <div class="context-header">
                <h3>Active Context</h3>
                <button id="btn-refresh-context" class="icon-btn">↻ Refresh</button>
            </div>

            <div id="context-stats" class="context-stats">
                <span class="stat-item">
                    <span class="stat-label">Memories</span>
                    <span class="stat-value" id="stat-memory-count">0</span>
                </span>
                <span class="stat-item">
                    <span class="stat-label">Avg Relevance</span>
                    <span class="stat-value" id="stat-avg-relevance">-</span>
                </span>
                <span class="stat-item">
                    <span class="stat-label">Last Updated</span>
                    <span class="stat-value" id="stat-last-update">-</span>
                </span>
            </div>

            <div id="memory-context-list" class="context-list">
                <div class="empty-state">No context available. Connect to backend to load memories.</div>
            </div>
        </div>

        <!-- Settings Tab -->
        <div id="tab-settings" class="tab-pane">
            <h2>Synchronization Settings</h2>

            <div class="form-group checkbox">
                <input type="checkbox" id="auto-sync" />
                <label for="auto-sync">Enable automatic synchronization</label>
            </div>

            <div class="form-group checkbox">
                <input type="checkbox" id="auto-extraction" />
                <label for="auto-extraction">Enable automatic memory extraction</label>
            </div>

            <div class="form-group">
                <label for="messages-per-sync">Messages per synchronization</label>
                <input type="number" id="messages-per-sync" min="1" max="100" value="10" />
            </div>

            <hr />

            <h2>Context Settings</h2>

            <div class="form-group">
                <label for="memories-per-context">Memories per context</label>
                <input type="number" id="memories-per-context" min="1" max="20" value="5" />
            </div>

            <div class="form-group">
                <label for="similarity-threshold">Similarity threshold (0.0 - 1.0)</label>
                <input type="range" id="similarity-threshold" min="0" max="1" step="0.05" value="0.7" />
                <span id="threshold-value">0.70</span>
            </div>

            <div class="form-group checkbox">
                <input type="checkbox" id="show-scores" />
                <label for="show-scores">Show relevance scores</label>
            </div>

            <hr />

            <h2>Advanced</h2>

            <div class="form-group checkbox">
                <input type="checkbox" id="debug-mode" />
                <label for="debug-mode">Enable debug logging</label>
            </div>

            <div class="button-group">
                <button id="btn-save" class="primary">Save Settings</button>
                <button id="btn-reset" class="danger">Reset to Defaults</button>
            </div>
        </div>
    </div>
</div>

<script>
(function() {
    'use strict';

    // Tab switching
    document.querySelectorAll('.tab-btn').forEach(btn => {
        btn.addEventListener('click', () => {
            const tabName = btn.dataset.tab;
            
            // Update buttons
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            
            // Update panes
            document.querySelectorAll('.tab-pane').forEach(p => p.classList.remove('active'));
            document.getElementById(`tab-${tabName}`).classList.add('active');
        });
    });

    // Load settings into form
    function loadSettings() {
        const state = window.DBMemoryState;
        if (!state) return;

        // Connection
        document.getElementById('backend-url').value = state.backendUrl || '';
        document.getElementById('username').value = state.username || '';
        document.getElementById('password').value = state.password || '';

        // Sync settings
        document.getElementById('auto-sync').checked = state.settings.autoSync;
        document.getElementById('auto-extraction').checked = state.settings.enableAutoExtraction;
        document.getElementById('messages-per-sync').value = state.settings.messagesPerSync;

        // Context settings
        document.getElementById('memories-per-context').value = state.settings.memoriesPerContext;
        document.getElementById('similarity-threshold').value = state.settings.similarityThreshold;
        document.getElementById('threshold-value').textContent = state.settings.similarityThreshold.toFixed(2);
        document.getElementById('show-scores').checked = state.settings.showRelevanceScores;

        // Advanced
        document.getElementById('debug-mode').checked = state.settings.debugMode;

        updateConnectionStatus(state.connected, state.connectionError);
    }

    // Connection handlers
    document.getElementById('btn-connect')?.addEventListener('click', async () => {
        const url = document.getElementById('backend-url').value.trim();
        const username = document.getElementById('username').value.trim();
        const password = document.getElementById('password').value;

        if (!url || !username || !password) {
            showStatus('Please fill in all connection fields', 'error');
            return;
        }

        const state = window.DBMemoryState;
        state.backendUrl = url;
        state.username = username;
        state.password = password;

        showStatus('Connecting...', 'info');
        
        try {
            const connected = await window.DBMemoryExtension?.connect();
            if (connected) {
                await state.save();
                showStatus('Connected successfully', 'success');
            }
        } catch (error) {
            showStatus(`Connection failed: ${error.message}`, 'error');
        }
    });

    document.getElementById('btn-disconnect')?.addEventListener('click', () => {
        window.DBMemoryExtension?.disconnect();
        window.DBMemoryState?.clearCredentials();
        showStatus('Disconnected', 'info');
        document.getElementById('password').value = '';
    });

    document.getElementById('btn-test')?.addEventListener('click', async () => {
        const url = document.getElementById('backend-url').value.trim();
        const username = document.getElementById('username').value.trim();
        const password = document.getElementById('password').value;

        if (!url || !username || !password) {
            showStatus('Please fill in all connection fields', 'error');
            return;
        }

        showStatus('Testing connection...', 'info');

        try {
            const response = await fetch(`${url}/api/health`, {
                method: 'GET',
                headers: {
                    'Authorization': `Basic ${btoa(`${username}:${password}`)}`,
                    'Content-Type': 'application/json'
                }
            });

            if (response.ok) {
                showStatus('✓ Connection successful!', 'success');
            } else {
                showStatus(`✗ HTTP ${response.status}`, 'error');
            }
        } catch (error) {
            showStatus(` ${error.message}`, 'error');
        }
    });

    // Save settings
    document.getElementById('btn-save')?.addEventListener('click', () => {
        const state = window.DBMemoryState;
        
        state.updateSettings({
            autoSync: document.getElementById('auto-sync').checked,
            enableAutoExtraction: document.getElementById('auto-extraction').checked,
            messagesPerSync: parseInt(document.getElementById('messages-per-sync').value) || 10,
            memoriesPerContext: parseInt(document.getElementById('memories-per-context').value) || 5,
            similarityThreshold: parseFloat(document.getElementById('similarity-threshold').value) || 0.7,
            showRelevanceScores: document.getElementById('show-scores').checked,
            debugMode: document.getElementById('debug-mode').checked
        });

        showStatus('Settings saved', 'success');
    });

    // Reset settings
    document.getElementById('btn-reset')?.addEventListener('click', () => {
        if (!confirm('Reset all settings to defaults?')) return;

        const state = window.DBMemoryState;
        state.updateSettings({
            autoSync: true,
            enableAutoExtraction: true,
            messagesPerSync: 10,
            memoriesPerContext: 5,
            similarityThreshold: 0.7,
            showRelevanceScores: true,
            debugMode: false
        });

        loadSettings();
        showStatus('Settings reset', 'info');
    });

    // Threshold slider
    document.getElementById('similarity-threshold')?.addEventListener('input', (e) => {
        document.getElementById('threshold-value').textContent = parseFloat(e.target.value).toFixed(2);
    });

    // Status indicator
    function updateConnectionStatus(connected, error) {
        const statusEl = document.getElementById('connection-status');
        if (!statusEl) return;

        if (connected) {
            statusEl.className = 'status-indicator connected';
            statusEl.innerHTML = '<span class="status-dot"></span> Connected';
        } else if (error) {
            statusEl.className = 'status-indicator error';
            statusEl.innerHTML = `<span class="status-dot"></span> ${error}`;
        } else {
            statusEl.className = 'status-indicator disconnected';
            statusEl.innerHTML = '<span class="status-dot"></span> Disconnected';
        }
    }

    function showStatus(message, type = 'info') {
        const statusEl = document.getElementById('connection-status');
        if (statusEl) {
            statusEl.className = `status-indicator ${type}`;
            statusEl.innerHTML = `<span class="status-dot"></span> ${message}`;
        }

        if (window.toast) {
            window.toast(message, type);
        }
    }

    // Listen for state changes
    document.addEventListener('db-memory:connectionChanged', (e) => {
        updateConnectionStatus(e.detail.connected, e.detail.error);
    });

    // Initialize
    setTimeout(loadSettings, 100);
})();
</script>
