<div class="extension-container">
    <div class="extension-header">
        <div class="extension-title">
            <i class="fa-solid fa-brain"></i>
            <span>DB Memory</span>
        </div>
        <div class="extension-status">
            <span id="db_memory_status" class="status-block status-error">
                <i class="fa-solid fa-circle-xmark"></i> Disconnected
            </span>
        </div>
        <div class="extension-toggle">
            <i class="fa-solid fa-chevron-down" id="db_memory_toggle_btn"></i>
        </div>
    </div>
    
    <div class="extension-content" id="db_memory_content" style="display: none;">
        <!-- Connection Section -->
        <div class="extension-section">
            <h4><i class="fa-solid fa-plug"></i> Connection</h4>
            <div class="form-group">
                <label for="db_memory_backend_url">Backend URL:</label>
                <input type="text" id="db_memory_backend_url" class="text_pole" placeholder="http://192.168.1.70:3000">
            </div>
            <div class="form-group">
                <label for="db_memory_username">Username:</label>
                <input type="text" id="db_memory_username" class="text_pole" placeholder="Username">
            </div>
            <div class="form-group">
                <label for="db_memory_password">Password:</label>
                <input type="password" id="db_memory_password" class="text_pole" placeholder="Password">
            </div>
            <div class="button-group">
                <button id="db_memory_connect_btn" class="menu_button">
                    <i class="fa-solid fa-plug"></i> Connect
                </button>
                <button id="db_memory_disconnect_btn" class="menu_button">
                    <i class="fa-solid fa-plug-circle-xmark"></i> Disconnect
                </button>
                <button id="db_memory_test_connection_btn" class="menu_button">
                    <i class="fa-solid fa-heartbeat"></i> Test Connection
                </button>
            </div>
        </div>

        <!-- Auto-Sync Section -->
        <div class="extension-section">
            <h4><i class="fa-solid fa-sync"></i> Auto-Sync</h4>
            <div class="checkbox-group">
                <label>
                    <input type="checkbox" id="db_memory_auto_sync">
                    <span>Auto-sync messages to database</span>
                </label>
            </div>
            <div class="checkbox-group">
                <label>
                    <input type="checkbox" id="db_memory_auto_extraction">
                    <span>Auto-extract memories from messages</span>
                </label>
            </div>
            <div class="form-group">
                <label for="db_memory_messages_per_sync">Messages per sync:</label>
                <input type="number" id="db_memory_messages_per_sync" class="text_pole" min="1" max="100" value="10">
            </div>
            <div class="checkbox-group">
                <label>
                    <input type="checkbox" id="db_memory_real_time_sync">
                    <span>Real-time sync</span>
                </label>
            </div>
        </div>

        <!-- Context Section -->
        <div class="extension-section">
            <h4><i class="fa-solid fa-brain"></i> Context Injection</h4>
            <div class="form-group">
                <label for="db_memory_memories_per_context">Memories per context:</label>
                <input type="number" id="db_memory_memories_per_context" class="text_pole" min="1" max="50" value="5">
            </div>
            <div class="form-group">
                <label for="db_memory_similarity_threshold">
                    Similarity threshold: <span id="db_memory_threshold_value">0.70</span>
                </label>
                <input type="range" id="db_memory_similarity_threshold" class="wide100p" min="0" max="1" step="0.01">
            </div>
            <div class="checkbox-group">
                <label>
                    <input type="checkbox" id="db_memory_show_scores">
                    <span>Show relevance scores</span>
                </label>
            </div>
        </div>

        <!-- Memory Browser Section -->
        <div class="extension-section">
            <h4><i class="fa-solid fa-list"></i> Memory Browser</h4>
            <div class="form-group">
                <input type="text" id="db_memory_search_input" class="text_pole flex1" placeholder="Search memories...">
                <button id="db_memory_search_btn" class="menu_button">Search</button>
                <button id="db_memory_refresh_btn" class="menu_button">Refresh</button>
            </div>
            <div id="db_memory_list" class="memory-list"></div>
            <div class="pagination">
                <button id="db_memory_prev_page" class="menu_button">← Prev</button>
                <span id="db_memory_page_info">Page 1</span>
                <button id="db_memory_next_page" class="menu_button">Next →</button>
            </div>
        </div>

        <!-- Context Preview Section -->
        <div class="extension-section">
            <h4><i class="fa-solid fa-eye"></i> Context Preview</h4>
            <div class="form-group">
                <button id="db_memory_refresh_context_btn" class="menu_button">Refresh Context</button>
            </div>
            <div id="db_memory_context_list" class="memory-list"></div>
        </div>

        <!-- Debug Section -->
        <div class="extension-section">
            <h4><i class="fa-solid fa-bug"></i> Debug</h4>
            <div class="checkbox-group">
                <label>
                    <input type="checkbox" id="db_memory_debug_mode">
                    <span>Debug mode (console logging)</span>
                </label>
            </div>
            <div class="button-group">
                <button id="db_memory_save_settings_btn" class="menu_button">
                    <i class="fa-solid fa-save"></i> Save Settings
                </button>
                <button id="db_memory_reset_settings_btn" class="menu_button">
                    <i class="fa-solid fa-undo"></i> Reset Defaults
                </button>
            </div>
        </div>
    </div>
</div>
