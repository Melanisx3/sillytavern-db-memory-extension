<!DOCTYPE html>
<html>
<head>

    <style>
        body { font-family: Arial, sans-serif; padding: 20px; }
        .btn { padding: 10px 20px; margin: 10px; background: #007bff; color: white; border: none; border-radius: 5px; cursor: pointer; }

<body>

    <script>

            alert('Перейдите в SillyTavern → Extensions → Install Extension и вставьте URL:\n\nhttps://github.com/Melanisx3/sillytavern-db-memory-extension');

        function openSettings() {
            alert('В SillyTavern:\n1. Extensions → DB Memory Extension\n2. Backend URL: http://192.168.1.70:3000\n3. Username: test_user\n4. Password: testpass123\n5. Connect');
        }
    </script>
</body>
</html>
