<div class="inline-drawer">
    <div class="inline-drawer-toggle inline-drawer-header">
        <b>DB Memory Extension</b>
        <span id="db_memory_status_badge" class="menu_button margin0" style="font-size:0.8em;cursor:default;">Disconnected</span>
        <div class="inline-drawer-icon fa-solid fa-circle-chevron-down down"></div>
    </div>
    <div class="inline-drawer-content">

        <!-- Connection -->
        <div class="db_memory_settings_block">
            <h4>Connection</h4>
            <div class="flex-container flexFlowColumn">
                <label for="db_memory_backend_url">Backend URL:</label>
                <input type="text" id="db_memory_backend_url" class="text_pole" placeholder="http://192.168.1.70:3000">
            </div>
            <div class="flex-container flexFlowColumn">
                <label for="db_memory_username">Username:</label>
                <input type="text" id="db_memory_username" class="text_pole" placeholder="Username">
            </div>
            <div class="flex-container flexFlowColumn">
                <label for="db_memory_password">Password:</label>
                <input type="password" id="db_memory_password" class="text_pole" placeholder="Password">
            </div>
            <div class="flex-container">
                <input type="button" id="db_memory_connect_btn" class="menu_button" value="Connect">
                <input type="button" id="db_memory_disconnect_btn" class="menu_button" value="Disconnect">
            </div>
            <div id="db_memory_connection_message" class="db_memory_message" style="display:none;"></div>
        </div>

        <hr>

        <!-- Auto-sync Settings -->
        <div class="db_memory_settings_block">
            <h4>Auto-Sync</h4>
            <label class="checkbox_label" for="db_memory_auto_sync">
                <input type="checkbox" id="db_memory_auto_sync">
                <span>Auto-sync messages to database</span>
            </label>
            <label class="checkbox_label" for="db_memory_auto_extraction">
                <input type="checkbox" id="db_memory_auto_extraction">
                <span>Auto-extract memories from messages</span>
            </label>
            <div class="flex-container flexFlowColumn">
                <label for="db_memory_messages_per_sync">Messages per sync:</label>
                <input type="number" id="db_memory_messages_per_sync" class="text_pole" min="1" max="100">
            </div>
        </div>

        <hr>

        <!-- Context Settings -->
        <div class="db_memory_settings_block">
            <h4>Context Injection</h4>
            <div class="flex-container flexFlowColumn">
                <label for="db_memory_memories_per_context">Memories per context:</label>
                <input type="number" id="db_memory_memories_per_context" class="text_pole" min="1" max="50">
            </div>
            <div class="flex-container flexFlowColumn">
                <label for="db_memory_similarity_threshold">
                    Similarity threshold: <span id="db_memory_threshold_value">0.70</span>
                </label>
                <input type="range" id="db_memory_similarity_threshold" class="wide100p" min="0" max="1" step="0.01">
            </div>
            <label class="checkbox_label" for="db_memory_show_scores">
                <input type="checkbox" id="db_memory_show_scores">
                <span>Show relevance scores</span>
            </label>
        </div>

        <hr>

        <!-- Memory Browser -->
        <div class="db_memory_settings_block">
            <h4>Memory Browser</h4>
            <div class="flex-container">
                <input type="text" id="db_memory_search_input" class="text_pole flex1" placeholder="Search memories...">
                <input type="button" id="db_memory_search_btn" class="menu_button" value="Search">
                <input type="button" id="db_memory_refresh_btn" class="menu_button" value="Refresh">
            </div>
            <div id="db_memory_list" class="db_memory_list_container"></div>
            <div class="flex-container justifyContentSpaceBetween">
                <input type="button" id="db_memory_prev_page" class="menu_button" value="← Prev">
                <span id="db_memory_page_info">Page 1</span>
                <input type="button" id="db_memory_next_page" class="menu_button" value="Next →">
            </div>
        </div>

        <hr>

        <!-- Context Preview -->
        <div class="db_memory_settings_block">
            <h4>Context Preview</h4>
            <div class="flex-container">
                <input type="button" id="db_memory_refresh_context_btn" class="menu_button" value="Refresh Context">
            </div>
            <div id="db_memory_context_list" class="db_memory_list_container"></div>
        </div>

        <hr>

        <!-- Debug -->
        <div class="db_memory_settings_block">
            <label class="checkbox_label" for="db_memory_debug_mode">
                <input type="checkbox" id="db_memory_debug_mode">
                <span>Debug mode (console logging)</span>
            </label>
            <div class="flex-container">
                <input type="button" id="db_memory_save_settings_btn" class="menu_button" value="Save Settings">
                <input type="button" id="db_memory_reset_settings_btn" class="menu_button" value="Reset Defaults">
            </div>
        </div>

    </div>
</div>
